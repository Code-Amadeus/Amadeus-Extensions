[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amadeus-extension-sdk"
version = "0.1.0"
description = "Standalone stdlib Runner SDK for Amadeus extension RPC v0"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]
