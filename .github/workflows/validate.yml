name: Protocol and SDK
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python tools/build_sdk.py --output-dir dist
